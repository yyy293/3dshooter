<!DOCTYPE html>
<html>
<head>
  <title>3D Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui">
  <div id="health">Health: 100</div>
  <div id="gun">Rifle (Auto)</div>
  <div id="crosshair">+</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light (sun)
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(50,100,50);
scene.add(light);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000),
  new THREE.MeshStandardMaterial({ color: 0x556655 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Simple building (collision object)
const building = new THREE.Mesh(
  new THREE.BoxGeometry(10,10,10),
  new THREE.MeshStandardMaterial({ color: 0x888888 })
);
building.position.set(0,5,-15);
scene.add(building);

const colliders = [building];

// Player
let health = 100;
const player = {
  velocity: new THREE.Vector3(),
  onGround: true
};

camera.position.set(0,2,5);

// Teams
const team = "blue";

// AI enemy
const enemy = new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
enemy.position.set(0,1,-25);
scene.add(enemy);

// Controls
const keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// Mouse look
let yaw = 0, pitch = 0;
document.body.addEventListener("click", () => document.body.requestPointerLock());

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement === document.body) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  }
});

// Weapons
let guns = [
  {name:"Rifle", damage:30, spread:0.02},
  {name:"SMG", damage:20, spread:0.05},
  {name:"Sniper", damage:80, spread:0.005}
];

let currentGun = 0;

document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "y") {
    currentGun = (currentGun + 1) % guns.length;
    document.getElementById("gun").innerText = guns[currentGun].name;
  }
});

// Fire mode toggle
let fireMode = "auto";
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "f") {
    fireMode = fireMode === "auto" ? "semi" : "auto";
  }
});

// Bullets
let bullets = [];

function shoot() {
  const gun = guns[currentGun];

  let dir = new THREE.Vector3(
    -Math.sin(yaw),
    -pitch,
    -Math.cos(yaw)
  );

  // spread
  dir.x += (Math.random()-0.5)*gun.spread;
  dir.y += (Math.random()-0.5)*gun.spread;

  bullets.push({
    pos: camera.position.clone(),
    dir: dir.normalize(),
    damage: gun.damage
  });
}

// Automatic fire
setInterval(() => {
  if (keys['e']) shoot();
}, 100);

// AI shooting
setInterval(() => {
  let dir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
  bullets.push({
    pos: enemy.position.clone(),
    dir: dir,
    damage: 10,
    fromEnemy: true
  });
}, 1000);

// Rain
let rainGeo = new THREE.BufferGeometry();
let rainCount = 2000;
let rainPos = [];

for (let i=0;i<rainCount;i++){
  rainPos.push(
    (Math.random()-0.5)*200,
    Math.random()*100,
    (Math.random()-0.5)*200
  );
}

rainGeo.setAttribute("position", new THREE.Float32BufferAttribute(rainPos,3));

let rain = new THREE.Points(
  rainGeo,
  new THREE.PointsMaterial({ size:0.2 })
);

scene.add(rain);

// Movement
const speed = 0.2;

function updatePlayer() {
  let forward = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  let right = new THREE.Vector3(-forward.z,0,forward.x);

  if(keys['w']) player.velocity.add(forward.clone().multiplyScalar(speed));
  if(keys['s']) player.velocity.add(forward.clone().multiplyScalar(-speed));
  if(keys['a']) player.velocity.add(right.clone().multiplyScalar(-speed));
  if(keys['d']) player.velocity.add(right.clone().multiplyScalar(speed));

  if(keys[' '] && player.onGround){
    player.velocity.y = 0.2;
    player.onGround = false;
  }

  player.velocity.y -= 0.01;

  camera.position.add(player.velocity);
  player.velocity.multiplyScalar(0.9);

  if(camera.position.y <= 2){
    camera.position.y = 2;
    player.onGround = true;
  }

  // simple building collision
  colliders.forEach(c=>{
    if(camera.position.distanceTo(c.position) < 6){
      camera.position.sub(player.velocity);
    }
  });
}

// Bullets update
function updateBullets() {
  bullets.forEach(b => {
    b.pos.add(b.dir.clone().multiplyScalar(0.8));

    // hit player
    if (!b.fromEnemy && b.pos.distanceTo(enemy.position) < 2) {
      scene.remove(enemy);
    }

    // hit player by enemy
    if (b.fromEnemy && b.pos.distanceTo(camera.position) < 1.5) {
      health -= b.damage;
      document.getElementById("health").innerText = "Health: " + health;
    }
  });
}

// Camera
function updateCamera() {
  camera.rotation.set(pitch, yaw, 0);
}

// Loop
function animate() {
  requestAnimationFrame(animate);

  updatePlayer();
  updateBullets();
  updateCamera();

  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
