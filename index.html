<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>War Prototype v2</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#ui { position:absolute; top:10px; left:10px; color:white; font-family:sans-serif; }
#crosshair { position:absolute; top:50%; left:50%; width:8px; height:8px; margin:-4px; border:2px solid white; border-radius:50%; }
#tutorial { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.7); padding:10px; display:none; }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="ui">HP: <span id="hp">100</span></div>
<div id="tutorial"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,5000);
let renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));

let ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshStandardMaterial({color:0x2e8b57}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// FPS camera
let yaw=0,pitch=0;
document.body.onclick=()=>document.body.requestPointerLock();
document.onmousemove=e=>{
 if(document.pointerLockElement===document.body){
  yaw-=e.movementX*0.002;
  pitch-=e.movementY*0.002;
  pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch));
 }
};

camera.position.set(0,2,5);
let vel=new THREE.Vector3();
let gravity=-0.015,canJump=true;

let keys={};
onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;

function move(){
 let speed=0.15;
 let forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
 let right=new THREE.Vector3(forward.z,0,-forward.x);
 if(keys['w']) vel.add(forward.clone().multiplyScalar(speed));
 if(keys['s']) vel.add(forward.clone().multiplyScalar(-speed));
 if(keys['a']) vel.add(right.clone().multiplyScalar(-speed));
 if(keys['d']) vel.add(right.clone().multiplyScalar(speed));
 vel.y+=gravity;
 if(keys[' ']&&canJump){ vel.y=0.3; canJump=false; }
 camera.position.add(vel);
 vel.multiplyScalar(0.9);
 if(camera.position.y<2){ camera.position.y=2; vel.y=0; canJump=true; }
 camera.rotation.set(pitch,yaw,0);
}

// Vehicles
let currentVehicle=null;
let tutorialShown=false;
let tutorial=document.getElementById('tutorial');

function showTutorial(text){
 tutorial.style.display='block';
 tutorial.innerText=text;
 setTimeout(()=>tutorial.style.display='none',4000);
}

let heli=new THREE.Mesh(new THREE.BoxGeometry(4,1,4),new THREE.MeshStandardMaterial({color:0x888888}));
heli.position.set(20,10,20);
heli.vel=new THREE.Vector3();
scene.add(heli);

let jet=new THREE.Mesh(new THREE.BoxGeometry(6,1,2),new THREE.MeshStandardMaterial({color:0xaaaaaa}));
jet.position.set(-20,20,-20);
jet.vel=new THREE.Vector3();
scene.add(jet);

// Enter vehicle (G)
addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='g'){
  if(camera.position.distanceTo(heli.position)<5){
    currentVehicle=heli;
    if(!tutorialShown){
      showTutorial('Helicopter: W/S=lift, A/D=rotate');
      tutorialShown=true;
    }
  } else if(camera.position.distanceTo(jet.position)<5){
    currentVehicle=jet;
    if(!tutorialShown){
      showTutorial('Jet: W=throttle, A/D=turn');
      tutorialShown=true;
    }
  } else {
    currentVehicle=null;
  }
 }
});

function updateVehicle(){
 if(!currentVehicle) return;

 if(currentVehicle===heli){
  if(keys['w']) currentVehicle.vel.y+=0.02;
  if(keys['s']) currentVehicle.vel.y-=0.02;
  if(keys['a']) currentVehicle.rotation.y+=0.03;
  if(keys['d']) currentVehicle.rotation.y-=0.03;
 }

 if(currentVehicle===jet){
  let forward=new THREE.Vector3(0,0,-1).applyEuler(currentVehicle.rotation);
  if(keys['w']) currentVehicle.vel.add(forward.multiplyScalar(0.1));
  if(keys['a']) currentVehicle.rotation.y+=0.02;
  if(keys['d']) currentVehicle.rotation.y-=0.02;
 }

 currentVehicle.vel.y+=gravity*0.3;
 currentVehicle.position.add(currentVehicle.vel);
 currentVehicle.vel.multiplyScalar(0.98);

 camera.position.copy(currentVehicle.position.clone().add(new THREE.Vector3(0,2,5)));
}

// AI shooting
let enemies=[];
function spawnEnemy(){
 let e=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:0xff0000}));
 e.position.set((Math.random()-0.5)*200,1,(Math.random()-0.5)*200);
 e.hp=5;
 e.cooldown=0;
 scene.add(e);
 enemies.push(e);
}
for(let i=0;i<10;i++) spawnEnemy();

let bullets=[];
function enemyShoot(e){
 let dir=new THREE.Vector3().subVectors(camera.position,e.position).normalize();
 let b=new THREE.Mesh(new THREE.SphereGeometry(0.05),new THREE.MeshBasicMaterial({color:0xff0000}));
 b.position.copy(e.position);
 b.vel=dir.multiplyScalar(1.5);
 scene.add(b);
 bullets.push(b);
}

function updateAI(){
 enemies.forEach(e=>{
  let dist=e.position.distanceTo(camera.position);
  if(dist<50){
    let dir=new THREE.Vector3().subVectors(camera.position,e.position).normalize();
    e.position.add(dir.multiplyScalar(0.02));
    e.lookAt(camera.position);

    e.cooldown--;
    if(e.cooldown<=0){ enemyShoot(e); e.cooldown=100; }
  }
 });
}

function updateBullets(){
 bullets.forEach(b=>{
  b.vel.y+=gravity*0.3;
  b.position.add(b.vel);
  if(b.position.distanceTo(camera.position)<1){
    document.getElementById('hp').textContent -=1;
  }
 });
}

function animate(){
 requestAnimationFrame(animate);
 if(!currentVehicle) move();
 updateVehicle();
 updateAI();
 updateBullets();
 renderer.render(scene,camera);
}
animate();

onresize=()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
